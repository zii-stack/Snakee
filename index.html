<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>NEON SNAKE</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ═══════════════════ START SCREEN ═══════════════════ -->
  <div id="startScreen" class="screen active">
    <div class="screen-content">
      <div class="logo-wrap">
        <div class="logo-snake-icon">
          <svg viewBox="0 0 80 80" width="80" height="80">
            <path d="M10 40 Q10 10 40 10 Q70 10 70 40 Q70 65 50 65 Q30 65 30 50 Q30 38 42 38"
              stroke="#00ffcc" stroke-width="7" fill="none" stroke-linecap="round"/>
            <circle cx="70" cy="40" r="5" fill="#00ffcc"/>
            <circle cx="66" cy="36" r="2" fill="#0a0a0f"/>
            <circle cx="74" cy="36" r="2" fill="#0a0a0f"/>
          </svg>
        </div>
        <h1 class="game-title">NEON<span>SNAKE</span></h1>
        <p class="tagline">SLITHER INTO THE VOID</p>
      </div>

      <div class="difficulty-section">
        <p class="section-label">SELECT DIFFICULTY</p>
        <div class="diff-buttons">
          <button class="diff-btn active" data-diff="easy">EASY</button>
          <button class="diff-btn" data-diff="medium">MEDIUM</button>
          <button class="diff-btn" data-diff="hard">HARD</button>
        </div>
      </div>

      <div class="highscore-display">
        <span class="hs-label">BEST SCORE</span>
        <span id="startHighScore" class="hs-value">0</span>
      </div>

      <button id="startBtn" class="primary-btn">
        <span class="btn-text">START GAME</span>
        <span class="btn-glow"></span>
      </button>

      <p class="how-to">Swipe or use D-Pad to move</p>
    </div>
    <div class="grid-bg"></div>
  </div>

  <!-- ═══════════════════ GAME SCREEN ═══════════════════ -->
  <div id="gameScreen" class="screen">
    <div class="game-header">
      <div class="stat-box">
        <span class="stat-label">SCORE</span>
        <span id="scoreDisplay" class="stat-value">0</span>
      </div>
      <button id="pauseBtn" class="icon-btn" aria-label="Pause">
        <svg id="pauseIcon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
          <rect x="5" y="3" width="4" height="18" rx="1"/>
          <rect x="15" y="3" width="4" height="18" rx="1"/>
        </svg>
        <svg id="playIcon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" style="display:none">
          <polygon points="5,3 19,12 5,21"/>
        </svg>
      </button>
      <div class="stat-box right">
        <span class="stat-label">BEST</span>
        <span id="highScoreDisplay" class="stat-value">0</span>
      </div>
    </div>

    <div class="canvas-wrap">
      <canvas id="gameCanvas"></canvas>
      <div id="pauseOverlay" class="pause-overlay hidden">
        <div class="pause-box">
          <p class="pause-title">PAUSED</p>
          <button id="resumeBtn" class="primary-btn small">RESUME</button>
          <button id="restartFromPause" class="secondary-btn small">RESTART</button>
          <button id="menuFromPause" class="secondary-btn small">MENU</button>
        </div>
      </div>
    </div>

    <!-- Virtual D-Pad -->
    <div class="dpad-container">
      <div class="dpad">
        <button class="dpad-btn dpad-up" data-dir="UP" aria-label="Up">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><polygon points="12,4 20,18 4,18"/></svg>
        </button>
        <button class="dpad-btn dpad-left" data-dir="LEFT" aria-label="Left">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><polygon points="4,12 18,4 18,20"/></svg>
        </button>
        <div class="dpad-center"></div>
        <button class="dpad-btn dpad-right" data-dir="RIGHT" aria-label="Right">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><polygon points="20,12 6,4 6,20"/></svg>
        </button>
        <button class="dpad-btn dpad-down" data-dir="DOWN" aria-label="Down">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><polygon points="12,20 4,6 20,6"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- ═══════════════════ GAME OVER SCREEN ═══════════════════ -->
  <div id="gameOverScreen" class="screen">
    <div class="go-content">
      <div class="go-icon">💀</div>
      <h2 class="go-title">GAME OVER</h2>

      <div class="go-stats">
        <div class="go-stat">
          <span class="go-stat-label">YOUR SCORE</span>
          <span id="finalScore" class="go-stat-value">0</span>
        </div>
        <div class="go-stat-divider"></div>
        <div class="go-stat">
          <span class="go-stat-label">BEST SCORE</span>
          <span id="finalHighScore" class="go-stat-value">0</span>
        </div>
      </div>

      <div id="newRecordBadge" class="new-record hidden">🏆 NEW RECORD!</div>

      <div class="go-buttons">
        <button id="restartBtn" class="primary-btn">
          <span class="btn-text">PLAY AGAIN</span>
          <span class="btn-glow"></span>
        </button>
        <button id="menuBtn" class="secondary-btn">MAIN MENU</button>
      </div>
    </div>
    <div class="go-particles" id="goParticles"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
